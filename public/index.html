<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ollama Chat</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="container">
      <div id="controls">
        <div>
          <label>system prompt:</label><br>
          <textarea id="systemPrompt" placeholder="system prompt"></textarea>
        </div>
        <div>
          <label>model:</label>
          <select id="model">
            <option value="">model</option>
          </select>
        </div>
        <div>
          <label>temperature:</label>
          <input type="range" id="temperature_slider" min="0" max="2" step="0.1" value="0.7">
          <span id="temperature_val">0.7</span>
        </div>
        <div>
          <input type="text" id="prompt" placeholder="prompt for text model">
          <input type="text" id="imageprompt" placeholder="prompt for image">
          <input type="text" id="imggood" placeholder="image good? (true or false): ">

          <button id="send">send</button>
          <button onclick="generateI(document.getElementById('imageprompt').value, document.getElementById('imggood').value)">image</button>
          <button id="clear">/clear</button>
        </div>
      </div>
      <div id="messages"></div>
      <img id="genimg">
    </div>
    <script src="script.js"></script>
    <script src="image.js"></script>
  </body>
</html>
